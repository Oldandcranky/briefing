name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Dockerfile's base image
      # notebooklm-py is deliberately absent: the tests stub the CLI, and
      # installing it here would pull a browser stack for no added coverage.
      - name: Install test dependencies
        run: pip install --disable-pip-version-check feedparser PyYAML "trafilatura>=2,<3"
      - name: Run the offline suite
        run: python tests/test_briefing.py

  image:
    name: Image builds and config still fits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t briefing:ci .
      # trafilatura 1.x resolves a justext/lxml.html.clean combination that
      # explodes on import, so building is not enough — the image has to run.
      - name: Import inside the image, against the example config
        run: |
          docker run --rm \
            -e BRIEFING_OUT=/tmp/out -e BRIEFING_CONFIG=/tmp/config.yaml \
            -v "$PWD/config.yaml.example:/tmp/config.yaml:ro" \
            briefing:ci python -c "
          import trafilatura, briefing as b
          assert isinstance(b.CFG['audio']['prompts'], list), 'audio.prompts must be a list'
          assert b.CFG['feed']['base_url'], 'feed.base_url missing'
          assert b.CFG['email']['to'], 'email.to missing'
          assert b.CFG['feed']['keep_episodes'] > 0, 'keep_episodes must be positive'
          print('ok:', len(b.CFG['feeds']), 'feeds,',
                len(b.CFG['audio']['prompts']), 'prompts,',
                'trafilatura', trafilatura.__version__)
          "
